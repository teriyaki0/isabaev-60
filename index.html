  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

Fspan>\n      <\u002Fdiv>\n      <div style=\"font-family:'Prata',serif; font-size:34px; line-height:1.15; text-wrap:balance\">Бақытжан Исабаев<\u002Fdiv>\n      <div style=\"margin-top:18px; padding-left:.3em; font-size:14px; font-weight:500; letter-spacing:.3em\">07 · 11 · 2026<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<div style=\"height:36px; background:#FFFFFF url(&quot;2e1aa029-4923-4c07-914a-464183957129&quot;) repeat-x center / auto 36px\"><\u002Fdiv>\n<section style=\"background:#FFFFFF; color:#5C0E19; padding:52px 30px 60px; text-align:center\">\n  <div style=\"font-family:'Prata',serif; font-size:26px; line-height:1.25; color:#7A1424; text-wrap:balance\">Құрметті ағайын-туыс, дос-жаран!<\u002Fdiv>\n  <p style=\"margin:20px auto 0; max-width:350px; font-size:16px; line-height:1.7; text-wrap:pretty\">Ардақты ағайын-туыс, қадірлі достар мен жақындар!<br>Сіздерді аяулы әкеміз, асыл жар, ардақты атамыздың 60 жас мерейтойына арналған ақ дастарханымыздың қадірлі қонағы болуға шақырамыз!<\u002Fp>\n\n  <sc-if value=\"{{ showCountdown }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"margin-top:48px; font-size:12px; font-weight:500; letter-spacing:.3em; text-transform:uppercase; color:#7A1424\">Тойға дейін<\u002Fdiv>\n    <div style=\"margin:22px auto 0; max-width:380px; display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:8px\">\n      <div style=\"border:1px solid #7A1424; border-radius:40px 40px 0 0; padding:24px 0 14px\"><div style=\"font-family:'Prata',serif; font-size:32px; line-height:1; color:#7A1424\">{{ cdDays }}<\u002Fdiv><div style=\"margin-top:8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase\">күн<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #7A1424; border-radius:40px 40px 0 0; padding:24px 0 14px\"><div style=\"font-family:'Prata',serif; font-size:32px; line-height:1; color:#7A1424\">{{ cdHours }}<\u002Fdiv><div style=\"margin-top:8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase\">сағат<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #7A1424; border-radius:40px 40px 0 0; padding:24px 0 14px\"><div style=\"font-family:'Prata',serif; font-size:32px; line-height:1; color:#7A1424\">{{ cdMin }}<\u002Fdiv><div style=\"margin-top:8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase\">минут<\u002Fdiv><\u002Fdiv>\n      <div style=\"border:1px solid #7A1424; border-radius:40px 40px 0 0; padding:24px 0 14px\"><div style=\"font-family:'Prata',serif; font-size:32px; line-height:1; color:#7A1424\">{{ cdSec }}<\u002Fdiv><div style=\"margin-top:8px; font-size:11px; letter-spacing:.12em; text-transform:uppercase\">секунд<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fsection>\n<div style=\"height:36px; background:#FFFFFF url(&quot;2e1aa029-4923-4c07-914a-464183957129&quot;) repeat-x center / auto 36px\"><\u002Fdiv>\n\n<section style=\"padding:60px 24px 60px; text-align:center\">\n  <div style=\"font-size:12px; font-weight:500; letter-spacing:.3em; text-transform:uppercase\">Тойдың күні<\u002Fdiv>\n  <div style=\"margin-top:30px; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); align-items:center; gap:18px; font-family:'Prata',serif\">\n    <div style=\"padding:10px 0; border-top:1px solid #FFFFFF; border-bottom:1px solid #FFFFFF; font-size:17px; letter-spacing:.14em; text-transform:uppercase\">Сенбі<\u002Fdiv>\n    <div style=\"font-size:88px; line-height:.95\">07<\u002Fdiv>\n    <div style=\"padding:10px 0; border-top:1px solid #FFFFFF; border-bottom:1px solid #FFFFFF; font-size:17px; letter-spacing:.14em\">12:00<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"margin-top:16px; padding-left:.3em; font-family:'Prata',serif; font-size:22px; letter-spacing:.3em; text-transform:uppercase\">Қараша 2026<\u002Fdiv>\n\n  <div style=\"margin:36px auto 0; max-width:360px; border:1px solid rgba(255,255,255,.5); padding:20px 14px 14px; background:#5C0E19\">\n    <div style=\"font-family:'Prata',serif; font-size:20px\">{{ monthLabel }}<\u002Fdiv>\n    <div style=\"margin-top:14px; display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); font-size:11px; font-weight:500; letter-spacing:.08em; text-transform:uppercase\">\n      <div>Дс<\u002Fdiv><div>Сс<\u002Fdiv><div>Ср<\u002Fdiv><div>Бс<\u002Fdiv><div>Жм<\u002Fdiv><div>Сн<\u002Fdiv><div>Жк<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"margin-top:6px; display:grid; grid-template-columns:repeat(7,minmax(0,1fr))\">\n      <sc-for list=\"{{ cells }}\" as=\"c\" hint-placeholder-count=\"35\">\n        <div style=\"height:40px; display:flex; align-items:center; justify-content:center; font-size:15px\">\n          <sc-if value=\"{{ c.plain }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFFFFF\">{{ c.d }}<\u002Fspan><\u002Fsc-if>\n          <sc-if value=\"{{ c.isEv }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:36px; height:36px; border-radius:50%; background:#FFFFFF; color:#7A1424; display:flex; align-items:center; justify-content:center; font-weight:600\">{{ c.d }}<\u002Fspan><\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:8px 24px 64px; text-align:center\">\n  <img src=\"63d2f900-5518-4d69-ba02-971409ed913e\" alt=\"\" style=\"width:40px; display:block; margin:0 auto 28px\">\n  <div style=\"font-size:12px; font-weight:500; letter-spacing:.3em; text-transform:uppercase\">Мекенжай<\u002Fdiv>\n  <div style=\"margin-top:16px; font-family:'Prata',serif; font-size:30px; line-height:1.2\">«Гулистан» мейрамханасы<\u002Fdiv>\n  <div style=\"margin-top:8px; font-size:16px\">Алматы қ., Сейфуллин даңғылы, 423<\u002Fdiv>\n  <div style=\"margin-top:28px; border:1px solid #FFFFFF; padding:6px; text-align:left\">\n    <div style=\"position:relative; height:320px; background:#F2ECE4\">\n      <div ref=\"{{ mapRef }}\" data-map=\"{{ mapId }}\" style=\"position:absolute; inset:0\"><\u002Fdiv>\n      <sc-if va -size:15px\">2026 жылғы 1 қарашаға дейін<\u002Fdiv>\n  <div style=\"margin-top:28px; display:flex; flex-direction:column; gap:10px; text-align:left\">\n    <input value=\"{{ name }}\" sc-camel-on-change=\"{{ onName }}\" placeholder=\"Аты-жөніңіз\" style=\"height:52px; padding:0 16px; border:1px solid #D9B8BD; border-radius:0; background:#FFFFFF; font-family:inherit; font-size:16px; color:#4E0B15; outline:none; box-sizing:border-box\" style-focus=\"border-color:#7A1424\">\n    <button sc-camel-on-click=\"{{ pickYes }}\" style=\"display:flex; align-items:center; gap:14px; height:52px; padding:0 16px; background:#FFFFFF; border:1px solid #D9B8BD; font-family:inherit; font-size:16px; color:#4E0B15; cursor:pointer; text-align:left\" style-hover=\"border-color:#7A1424\">\n      <span style=\"flex:none; width:16px; height:16px; border:1.5px solid #7A1424; transform:rotate(45deg); display:flex; align-items:center; justify-content:center; box-sizing:border-box\"><sc-if value=\"{{ isYes }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:7px; height:7px; background:#7A1424\"><\u002Fspan><\u002Fsc-if><\u002Fspan>\n      <span>Келемін<\u002Fspan>\n    <\u002Fbutton>\n    <button sc-camel-on-click=\"{{ pickNo }}\" style=\"display:flex; align-items:center; gap:14px; height:52px; padding:0 16px; background:#FFFFFF; border:1px solid #D9B8BD; font-family:inherit; font-size:16px; color:#4E0B15; cursor:pointer; text-align:left\" style-hover=\"border-color:#7A1424\">\n      <span style=\"flex:none; width:16px; height:16px; border:1.5px solid #7A1424; transform:rotate(45deg); display:flex; align-items:center; justify-content:center; box-sizing:border-box\"><sc-if value=\"{{ isNo }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:7px; height:7px; background:#7A1424\"><\u002Fspan><\u002Fsc-if><\u002Fspan>\n      <span>Өкінішке орай, келе алмаймын<\u002Fspan>\n    <\u002Fbutton>\n    <sc-if value=\"{{ canSend }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ onSend }}\" style=\"margin-top:6px; width:100%; height:54px; background:#7A1424; color:#FFFFFF; border:none; font-family:inherit; font-size:15px; font-weight:500; letter-spacing:.04em; cursor:pointer\" style-hover=\"background:#5E0F1B\" style-active=\"background:#4E0B15\">Жауап жіберу<\u002Fbutton><\u002Fsc-if>\n    <sc-if value=\"{{ sending }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:6px; height:54px; display:flex; align-items:center; justify-content:center; background:#A9787F; color:#FFFFFF; font-size:15px; font-weight:500; letter-spacing:.04em\">Жіберілуде…<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ sent }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:6px; padding:16px; border:1px solid #7A1424; text-align:center; font-size:15px; line-height:1.5; color:#7A1424\">Рахмет! Жауабыңыз қабылданды.<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ needName }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:4px; text-align:center; font-size:14px; color:#7A1424\">Аты-жөніңізді жазыңыз<\u002Fdiv><\u002Fsc-if>\n    <sc-if value=\"{{ failed }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"margin-top:4px; text-align:center; font-size:14px; color:#7A1424\">Жауап жіберілмеді. Қайталап көріңіз.<\u002Fdiv><\u002Fsc-if>\n  <\u002Fdiv>\n<\u002Fsection>\n<div style=\"height:36px; background:#FFFFFF url(&quot;2e1aa029-4923-4c07-914a-464183957129&quot;) repeat-x center / auto 36px\"><\u002Fdiv>\n\n<footer style=\"padding:60px 28px 0; text-align:center\">\n  <img src=\"30fdbc07-d9fc-4a76-9039-3269ab53b18a\" alt=\"\" style=\"width:72px; height:72px; display:block; margin:0 auto\">\n  <div style=\"margin-top:26px; padding-left:.3em; font-size:15px; font-weight:500; letter-spacing:.3em; text-transform:uppercase; text-align:center\">Той иелері<\u002Fdiv>\n  <div style=\"margin-top:14px; font-family:'Prata',serif; font-size:32px; line-height:1.2\">Исабаевтар әулеті<\u002Fdiv>\n  <div style=\"margin:52px -28px 0; height:36px; background:url(&quot;623cd199-36a3-4a33-864f-0c3f17612a83&quot;) repeat-x center / auto 36px\"><\u002Fdiv>\n<\u002Ffooter>\n\n<div ref=\"{{ ytRef }}\" data-yt=\"{{ mapId }}\" style=\"position:fixed; left:-10000px; top:0; width:200px; height:200px; opacity:0; pointer-events:none\"><\u002Fdiv>\n<sc-if value=\"{{ showMusicBtn }}\" hint-placeholder-val=\"{{ false }}\">\n  <button sc-camel-on-click=\"{{ toggleMusic }}\" aria-label=\"Әуен\" style=\"position:fixed; z-index:900; bottom:20px; right:max(16px, calc(50% - 214px)); width:52px; height:52px; border-radius:50%; border:1.5px solid #FFFFFF; background:#7A1424; color:#FFFFFF; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 6px 20px rgba(0,0,0,.35); padding:0\" style-hover=\"background:#5E0F1B\">\n    <sc-if value=\"{{ playing }}\" hint-placeholder-val=\"{{ true }}\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 20 20\"><rect x=\"4\" y=\"3\" width=\"4\" height=\"14\" fill=\"#FFFFFF\"><\u002Frect><rect x=\"12\" y=\"3\" width=\"4\" height=\"14\" fill=\"#FFFFFF\"><\u002Frect><\u002Fsvg><\u002Fsc-if>\n    <sc-if value=\"{{ paused }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 22 22\"><path d=\"M8 17.5V4.5L18 2.5V15.5\" fill=\"none\" stroke=\"#FFFFFF\" stroke-width=\"1.8\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"5.5\" cy=\"17.5\" r=\"2.8\" fill=\"#FFFFFF\"><\u002Fcircle><circle cx=\"15.5\" cy=\"15.5\" r=\"2.8\" fill=\"#FFFFFF\"><\u002Fcircle><\u002Fsvg><\u002Fsc-if>\n  <\u002Fbutton>\n<\u002Fsc-if>\n<sc-if value=\"{{ showSplash }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"position:fixed; inset:0; z-index:1000; background:#7A1424 url(&quot;c8537fe2-d927-4088-a2fb-9214a4e1acc1&quot;); color:#FFFFFF; display:flex; flex-direction:column; font-family:'Golos Text',system-ui,sans-serif\">\n    <div style=\"height:36px; flex:none; background:url(&quot;623cd199-36a3-4a33-864f-0c3f17612a83&quot;) repeat-x center / auto 36px\"><\u002Fdiv>\n    <div style=\"flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px\">\n      <img src=\"30fdbc07-d9fc-4a76-9039-3269ab53b18a\" alt=\"\" style=\"width:88px; height:88px; display:block\">\n      <div style=\"margin-top:28px; padding-left:.34em; font-size:12px; font-weight:500; letter-spacing:.34em; text-transform:uppercase\">Мерейтой<\u002Fdiv>\n      <div style=\"margin-top:10px; font-family:'Prata',serif; font-size:120px; line-height:1\">60<\u002Fdiv>\n      <div style=\"margin-top:14px; font-family:'Prata',serif; font-size:28px; line-height:1.2\">Бақытжан Исабаев<\u002Fdiv>\n      <button sc-camel-on-click=\"{{ openInvite }}\" style=\"margin-top:40px; height:54px; padding:0 34px; background:#FFFFFF; color:#7A1424; border:none; font-family:inherit; font-size:15px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; cursor:pointer\" style-hover=\"background:#F5EAEB\" style-active=\"background:#EBD5D8\">Шақыруды ашу<\u002Fbutton>\n    <\u002Fdiv>\n    <div style=\"height:36px; flex:none; background:url(&quot;623cd199-36a3-4a33-864f-0c3f17612a83&quot;) repeat-x center / auto 36px\"><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;eventDate&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2026-11-07T12:00&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Той&quot;},&quot;showCountdown&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Той&quot;},&quot;sheetUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://script.google.com/macros/s/AKfycbyJYNnji8NkNCz3YwVqzIlVcVpoPQNcl1nvV0XQg1l2cic5QpJcr4MmuX6gYyqSRUW1/exec&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Google кесте&quot;}}\">\nclass Component extends DCLogic {\n  state = { now: Date.now(), name: '', choice: 'yes', status: 'idle', mapFailed: false };\n  mapRef = React.createRef();\n  ytRef = React.createRef();\n  mapId = 'map' + Math.random().toString(36).slice(2, 9);\n  componentDidMount() {\n    this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);\n    this.tries = 0;\n    this.initMap();\n    this.ytTries = 0;\n    if (!this.props.noSplash) { this.initYT(); document.body.style.overflow = 'hidden'; }\n  }\n  initYT() {\n    const host = this.ytRef.current || document.querySelector(`[data-yt=\"${this.mapId}\"]`);\n    if (!(window.YT && window.YT.Player) && !document.getElementById('yt-api')) {\n      const sc = document.createElement('script');\n      sc.id = 'yt-api'; sc.src = 'https://www.youtube.com/iframe_api';\n      document.head.appendChild(sc);\n    }\n    if (!host || !(window.YT && window.YT.Player)) {\n      if (this.ytTries++ < 150) this.ytRetry = setTimeout(() => this.initYT(), 200);\n      return;\n    }\n    const div = document.createElement('div');\n    host.appendChild(div);\n    const id = 'X5xTN2g072w';\n    this.yt = new window.YT.Player(div, {\n      videoId: id, width: 200, height: 200,\n      playerVars: { autoplay: 0, controls: 0, loop: 1, playlist: id, playsinline: 1, rel: 0 },\n      events: {\n        onReady: () => { this.ytReady = true; if (this.wantPlay) this.playMusic(); },\n        onStateChange: e => this.setState({ playing: e.data === 1 || e.data === 3 })\n      }\n    });\n  }\n  playMusic() {\n    if (!this.ytReady) { this.wantPlay = true; return; }\n    try { this.yt.unMute(); this.yt.setVolume(70); this.yt.playVideo(); } catch (e) {}\n  }\n  componentDidUpdate(prev) {\n    if (!this.mapObj && prev.gisKey !== this.props.gisKey) { this.tries = 0; this.setState({ mapFailed: false }); this.initMap(); }\n    if (this.mapObj && (prev.lat !== this.props.lat || prev.lon !== this.props.lon)) {\n      const ll = [this.lat(), this.lon()];\n      this.mapObj.map.setView(ll);\n      this.mapObj.marker.setLatLng(ll);\n    }\n  }\n  componentWillUnmount() {\n    clearInterval(this.timer); clearTimeout(this.retry); clearTimeout(this.ytRetry);\n    document.body.style.overflow = '';\n    if (this.yt) { try { this.yt.destroy(); } catch (e) {} }\n    if (this.mapObj) { try { this.mapObj.map.remove(); } catch (e) {} }\n  }\n  lat() { return Number(this.props.lat ?? 43.276594); }\n  lon() { return Number(this.props.lon ?? 76.931706); }\n  key() { return String(this.props.gisKey ?? '').trim(); }\n  initMap() {\n    const el = this.mapRef.current || document.querySelector(`[data-map=\"${this.mapId}\"]`);\n    if (!el || !window.mount2gis) {\n      if (this.tries++ < 60) this.retry = setTimeout(() => this.initMap(), 200);\n      else this.setState({ mapFailed: true });\n      return;\n    }\n    window.mount2gis(el, { lat: this.lat(), lon: this.lon(), zoom: 16, color: '#7A1424', link: 'https://2gis.kz/almaty/firm/9429940000901210' })\n      .then(o => { this.mapObj = o; })\n      .catch(() => this.setState({ mapFailed: true }));\n  }\n  renderVals() {\n    const ev = new Date(this.props.eventDate ?? '2026-11-07T12:00');\n    const valid = !isNaN(ev.getTime());\n    const diff = valid ? Math.max(0, ev.getTime() - this.state.now) : 0;\n    const pad = n => String(n).padStart(2, '0');\n    const labels = { yes: 'Келемін', pair: 'Жұбыммен келемін', no: 'Өкінішке орай, келе алмаймын' };\n    const pick = c => () => this.setState(st => ({ choice: c, status: st.status === 'sent' ? 'sent' : 'idle' }));\n    const ch = this.state.choice;\n    const st = this.state.status;\n    const lat = this.lat(), lon = this.lon();\n    const phone = String(this.props.whatsapp ?? '77075653907').replace(/\\D/g, '');\n    const dateStr = valid ? `${pad(ev.getDate())}.${pad(ev.getMonth() + 1)}.${ev.getFullYear()}` : '';\n    const months = ['Қаңтар','Ақпан','Наурыз','Сәуір','Мамыр','Маусым','Шілде','Тамыз','Қыркүйек','Қазан','Қараша','Желтоқсан'];\n    const cells = [];\n    let monthLabel = '';\n    if (valid) {\n      const y = ev.getFullYear(), m = ev.getMonth();\n      monthLabel = `${months[m]} ${y}`;\n      const off = (new Date(y, m, 1).getDay() + 6) % 7;\n      const n = new Date(y, m + 1, 0).getDate();\n      for (let i = 0; i < off; i++) cells.push({ d: '', plain: true, isEv: false });\n      for (let d = 1; d <= n; d++) cells.push({ d, plain: d !== ev.getDate(), isEv: d === ev.getDate() });\n    }\n    return {\n      monthLabel, cells,\n      cdDays: Math.floor(diff / 864e5),\n      cdHours: pad(Math.floor(diff / 36e5) % 24),\n      cdMin: pad(Math.floor(diff / 6e4) % 60),\n      cdSec: pad(Math.floor(diff / 1e3) % 60),\n      showCountdown: this.props.showCountdown ?? true,\n      mapRef: this.mapRef,\n      ytRef: this.ytRef,\n      showSplash: !this.props.noSplash && !this.state.opened,\n      showMusicBtn: !this.props.noSplash && !!this.state.opened,\n      playing: !!this.state.playing,\n      paused: !this.state.playing,\n      openInvite: () => { this.playMusic(); document.body.style.overflow = ''; this.setState({ opened: true }); },\n      toggleMusic: () => {\n        if (this.state.playing && this.yt) { try { this.yt.pauseVideo(); } catch (e) {} this.setState({ playing: false }); }\n        else this.playMusic();\n      },\n      mapId: this.mapId,\n      mapFailed: this.state.mapFailed,\n      noKey: !this.key(),\n      gisUrl: 'https://2gis.kz/almaty/firm/9429940000901210',\n      routeUrl: 'https://2gis.kz/almaty/directions/points/%7C76.931706%2C43.276594%3B9429940000901210',\n      name: this.state.name,\n      onName: e => { const v = e.target.value; this.setState(st => ({ name: v, status: st.status === 'sent' ? 'sent' : 'idle' })); },\n      isYes: ch === 'yes', isPair: ch === 'pair', isNo: ch === 'no',\n      pickYes: pick('yes'), pickPair: pick('pair'), pickNo: pick('no'),\n      canSend: st === 'idle' || st === 'needName' || st === 'failed',\n      sending: st === 'sending',\n      sent: st === 'sent',\n      needName: st === 'needName',\n      failed: st === 'failed',\n      onSend: () => {\n        const name = this.state.name.trim();\n        if (!name) { this.setState({ status: 'needName' }); return; }\n        const DEF = 'https://script.google.com/macros/s/AKfycbyJYNnji8NkNCz3YwVqzIlVcVpoPQNcl1nvV0XQg1l2cic5QpJcr4MmuX6gYyqSRUW1/exec';\n        let url = String(this.props.sheetUrl || '').trim();\n        if (!/^https:\\/\\/script\\.google\\.com\\/macros\\/s\\/.+\\/exec$/.test(url)) url = DEF;\n        this.setState({ status: 'sending' });\n        // Several delivery channels; the sheet script de-duplicates by id.\n        const id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);\n        const params = { id, name, answer: labels[ch] };\n        const qs = new URLSearchParams(params).toString();\n        try { fetch(url, { method: 'POST', mode: 'no-cors', credentials: 'omit', keepalive: true, body: new URLSearchParams(params) }).catch(() => {}); } catch (e) {}\n        try { const img = new Image(); img.referrerPolicy = 'no-referrer'; img.src = url + '?' + qs; } catch (e) {}\n        try {\n          const ifr = document.createElement('iframe');\n          ifr.name = 'rsvp_' + id; ifr.style.display = 'none';\n          document.body.appendChild(ifr);\n          const form = document.createElement('form');\n          form.method = 'POST'; form.action = url; form.target = ifr.name; form.style.display = 'none';\n          Object.entries(params).forEach(([k, v]) => { const i = document.createElement('input'); i.type = 'hidden'; i.name = k; i.value = v; form.appendChild(i); });\n          document.body.appendChild(form);\n          form.submit();\n          setTimeout(() => { form.remove(); ifr.remove(); }, 20000);\n        } catch (e) {}\n        setTimeout(() => this.setState({ status: 'sent' }), 1200);\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
